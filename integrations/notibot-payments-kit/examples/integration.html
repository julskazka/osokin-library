<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пример проверки оплат Notibot</title>
<script src="../js/notibot-message-guard.js"></script>
<script src="https://list.notibot.ru/notibot-bridge.js?v=2.27"></script>
<script src="../js/notibot-payments.js"></script>
</head>
<body>
<!-- Пример логики. В реальном проекте оставьте существующие дизайн и элементы. -->
<button id="refresh" type="button">Обновить доступ</button>
<p id="error" hidden>Не удалось обновить доступ. Попробуйте ещё раз.</p>
<p id="outside" hidden>Откройте эту страницу внутри Notibot.</p>
<button id="buy" type="button" hidden>Получить доступ</button>
<button id="open" type="button" hidden>Открыть материал</button>
<script>
// Замените все три значения реальными ID из одного магазина Notibot.
const PRODUCT_ID='REPLACE_WITH_PRODUCT_ID';
const PURCHASE_PAGE_ID='REPLACE_WITH_PURCHASE_PAGE_ID';
const ACCESS_PAGE_ID='REPLACE_WITH_ACCESS_PAGE_ID';
const $=id=>document.getElementById(id);
const payments=NotibotPayments.create({onChange(state){
  const ready=state.status==='ready';
  const paid=ready&&state.purchasedProductIds.includes(PRODUCT_ID);
  $('buy').hidden=!ready||paid;
  $('open').hidden=!paid;
  $('error').hidden=!['error','unavailable'].includes(state.status);
  $('outside').hidden=state.status!=='standalone';
}});
$('refresh').onclick=async()=>{await payments.refresh({forceRefresh:true});};
$('buy').onclick=()=>window.notibot.openLink('https://t.me/post#'+encodeURIComponent(PURCHASE_PAGE_ID));
$('open').onclick=()=>window.notibot.openLink('https://t.me/post#'+encodeURIComponent(ACCESS_PAGE_ID));
</script>
</body>
</html>
